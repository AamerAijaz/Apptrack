services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apptrack
      POSTGRES_PASSWORD: apptrack
      POSTGRES_DB: apptrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptrack -d apptrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
